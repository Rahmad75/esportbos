<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsportBos - Payment Callback</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(22, 33, 62, 0.9);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #00d4ff;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .status {
            font-size: 24px;
            margin: 20px 0;
            min-height: 60px;
        }
        .loading { color: #ffc107; }
        .success { color: #28a745; }
        .failed { color: #dc3545; }
        .message {
            color: #aaa;
            margin-top: 20px;
            font-size: 14px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #00d4ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 EsportBos Payment</h1>
        <div id="status" class="status loading">
            <div class="spinner"></div>
            Memproses pembayaran...
        </div>
        <div class="message">Mohon tunggu sebentar</div>
    </div>

    <script type="module" src="payment-callback.js"></script>
</body>
</html>
