<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsportBos - Payment Callback</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #1a1a2e; color: white; }
        .container { max-width: 600px; margin: 0 auto; background: #16213e; padding: 40px; border-radius: 15px; }
        h1 { color: #00d4ff; }
        .status { font-size: 24px; margin: 20px 0; }
        .success { color: #28a745; }
        .failed { color: #dc3545; }
        .loading { color: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 EsportBos Payment</h1>
        <div id="status" class="status loading">⏳ Memproses pembayaran...</div>
        <p id="message">Mohon tunggu sebentar</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
// Init Supabase (cek dulu biar gak duplikat)
if (!window.supabaseClient) {
    window.supabaseClient = window.supabase.createClient(
        'https://xvnmpbmyxphrddjjldbt.supabase.co',
        'sb_publishable_qB9jHOOjiiJDrEQR5XndKA_ji_w-jsv'
    );
}
const supabase = window.supabaseClient;

// Check URL parameters
const urlParams = new URLSearchParams(window.location.search);
const mockSuccess = urlParams.get('mock');
const orderId = urlParams.get('orderId');

async function processPayment() {
    try {
        if (mockSuccess === 'success') {
            // MODE TESTING - Langsung sukses
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Get user
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/index.html';
                return;
            }

            // Find transaction
            const { data: transaction } = await supabase
                .from('transactions')
                .select('*')
                .eq('order_id', orderId)
                .single();

            if (transaction) {
                // Update status
                await supabase
                    .from('transactions')
                    .update({ status: 'completed', completed_at: new Date().toISOString() })
                    .eq('order_id', orderId);

                // Add diamonds & gold
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('diamonds, gold')
                    .eq('id', session.user.id)
                    .single();

                await supabase
                    .from('profiles')
                    .update({
                        diamonds: (profile.diamonds || 0) + (transaction.diamonds || 0),
                        gold: (profile.gold || 0) + (transaction.gold || 0)
                    })
                    .eq('id', session.user.id);

                document.getElementById('status').innerHTML = `
                    <div class="success">
                        ✅ Pembayaran Berhasil!<br><br>
                        💎 +${transaction.diamonds} Diamond<br>
                        🟡 +${transaction.gold} Gold<br><br>
                        <small>Redirecting...</small>
                    </div>
                `;

                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 3000);

            } else {
                document.getElementById('status').innerHTML = '<div class="failed">❌ Transaksi tidak ditemukan</div>';
            }

        } else {
            // MODE PRODUCTION - Handle Duitku callback
            document.getElementById('status').innerHTML = '<div class="loading">Verifikasi pembayaran...</div>';
            
            // Di sini nanti logic verify callback dari Duitku
            // Untuk sekarang, redirect aja
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 2000);
        }

    } catch (error) {
        console.error('Error:', error);
        document.getElementById('status').innerHTML = '<div class="failed"> Error: ' + error.message + '</div>';
    }
}

// Run on load
document.addEventListener('DOMContentLoaded', processPayment);
</script>
</body>
</html>
