<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsportBos - Payment Callback</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #1a1a2e; color: white; }
        .container { max-width: 600px; margin: 0 auto; background: #16213e; padding: 40px; border-radius: 15px; }
        h1 { color: #00d4ff; }
        .status { font-size: 24px; margin: 20px 0; }
        .success { color: #28a745; }
        .failed { color: #dc3545; }
        .loading { color: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 EsportBos Payment</h1>
        <div id="status" class="status loading">⏳ Memproses pembayaran...</div>
        <p id="message">Mohon tunggu sebentar</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xvnmpbmyxphrddjjldbt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qB9jHOOjiiJDrEQR5XndKA_ji_w-jsv';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const merchantOrderId = urlParams.get('merchantOrderId');
            const resultCode = urlParams.get('resultCode');
            const amount = urlParams.get('amount');
            
            if (!merchantOrderId) {
                document.getElementById('status').className = 'status failed';
                document.getElementById('status').textContent = '❌ Callback Tidak Valid';
                document.getElementById('message').textContent = 'Parameter transaksi tidak ditemukan.';
                setTimeout(() => window.location.href = 'dashboard.html', 3000);
                return;
            }

            try {
                // Ambil data transaksi
                const { data: transaction, error: fetchError } = await supabase
                    .from('transactions')
                    .select('*')
                    .eq('transaction_id', merchantOrderId)
                    .single();

                if (fetchError || !transaction) {
                    throw new Error('Transaksi tidak ditemukan');
                }

                // Cek status dari Duitku (0 = success)
                const isSuccess = resultCode === '0';
                const newStatus = isSuccess ? 'success' : 'failed';

                // Update status transaksi
                const { error: updateError } = await supabase
                    .from('transactions')
                    .update({
                        status: newStatus,
                        updated_at: new Date().toISOString()
                    })
                    .eq('transaction_id', merchantOrderId);

                if (updateError) throw updateError;

                // Jika sukses, update saldo user
                if (isSuccess && transaction.status !== 'success') {
                    const { error: balanceError } = await supabase
                        .from('profiles')
                        .update({
                            diamonds: (transaction.diamond || 0),
                            gold: (transaction.gold || 0)
                        })
                        .eq('id', transaction.user_id);

                    if (balanceError) throw balanceError;
                }

                // Tampilkan hasil
                const statusEl = document.getElementById('status');
                const messageEl = document.getElementById('message');

                if (isSuccess) {
                    statusEl.className = 'status success';
                    statusEl.textContent = '✅ Pembayaran Berhasil!';
                    messageEl.textContent = `${transaction.diamond} Diamond dan ${transaction.gold} Gold telah ditambahkan ke akun Anda.`;
                } else {
                    statusEl.className = 'status failed';
                    statusEl.textContent = '❌ Pembayaran Gagal';
                    messageEl.textContent = 'Transaksi dibatalkan atau gagal. Silakan coba lagi.';
                }

                setTimeout(() => window.location.href = 'dashboard.html', 5000);

            } catch (err) {
                console.error('Callback error:', err);
                document.getElementById('status').className = 'status failed';
                document.getElementById('status').textContent = '❌ Error';
                document.getElementById('message').textContent = err.message;
            }
        });
    </script>
</body>
</html>
