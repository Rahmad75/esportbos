<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - EsportBos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(22, 33, 62, 0.95);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #00d4ff; margin-bottom: 30px; font-size: 32px; }
        .status { font-size: 20px; margin: 20px 0; min-height: 80px; line-height: 1.6; }
        .loading { color: #ffc107; }
        .success { color: #28a745; }
        .failed { color: #dc3545; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #00d4ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> EsportBos Payment</h1>
        <div id="status" class="status loading">
            <div class="spinner"></div>
            Memproses pembayaran...
        </div>
        <div id="message" style="color: #aaa; margin-top: 20px; font-size: 14px;">Mohon tunggu sebentar</div>
    </div>

    <script>
    (function() {
        var supabaseClient = window.supabase.createClient(
            'https://xvnmpbmyxphrddjjldbt.supabase.co',
            'sb_publishable_qB9jHOOjiiJDrEQR5XndKA_ji_w-jsv'
        );

        async function processPayment() {
            try {
                var urlParams = new URLSearchParams(window.location.search);
                var mockSuccess = urlParams.get('mock');
                var orderId = urlParams.get('orderId');

                console.log('Params:', { mock: mockSuccess, orderId: orderId });

                if (mockSuccess === 'success') {
                    await new Promise(function(resolve) { setTimeout(resolve, 2000); });

                    var sessionResult = await supabaseClient.auth.getSession();
                    var currentUser = sessionResult.data.session;

                    if (!currentUser) {
                        document.getElementById('status').innerHTML = '<div class="failed">❌ Silakan login dulu</div>';
                        document.getElementById('message').textContent = 'Redirecting ke login...';
                        setTimeout(function() { window.location.href = '/index.html'; }, 3000);
                        return;
                    }

                    console.log('User:', currentUser.user.email);

                    var txResult = await supabaseClient
                        .from('transactions')
                        .select('*')
                        .eq('user_id', currentUser.user.id)
                        .eq('status', 'pending')
                        .order('created_at', { ascending: false })
                        .limit(1);

                    console.log('Transactions:', txResult);

                    if (txResult.error || !txResult.data || txResult.data.length === 0) {
                        document.getElementById('status').innerHTML = '<div class="failed">❌ Tidak ada transaksi pending</div>';
                        document.getElementById('message').textContent = 'Coba lagi nanti';
                        return;
                    }

                    var transaction = txResult.data[0];
                    console.log('Transaction:', transaction);

                    var updateResult = await supabaseClient
                        .from('transactions')
                        .update({ status: 'completed', completed_at: new Date().toISOString() })
                        .eq('id', transaction.id);

                    console.log('Update result:', updateResult);

                    var profileResult = await supabaseClient
                        .from('profiles')
                        .select('diamonds, gold')
                        .eq('id', currentUser.user.id)
                        .single();

                    var profile = profileResult.data;
                    var newDiamonds = (profile.diamonds || 0) + (transaction.diamonds || 0);
                    var newGold = (profile.gold || 0) + (transaction.gold || 0);

                    var profileUpdate = await supabaseClient
                        .from('profiles')
                        .update({ diamonds: newDiamonds, gold: newGold })
                        .eq('id', currentUser.user.id);

                    console.log('Profile update:', profileUpdate);

                    document.getElementById('status').innerHTML = 
                        '<div class="success">✅ Pembayaran Berhasil!<br><br>' +
                        '💎 +' + transaction.diamonds + ' Diamond<br>' +
                        '🟡 +' + transaction.gold + ' Gold<br><br>' +
                        '<small>Redirecting...</small></div>';
                    document.getElementById('message').textContent = 'Saldo berhasil ditambahkan!';

                    setTimeout(function() {
                        window.location.href = '/pendanaan-klub.html';
                    }, 3000);

                } else {
                    document.getElementById('status').innerHTML = '<div class="loading">Verifikasi pembayaran...</div>';
                    setTimeout(function() {
                        window.location.href = '/pendanaan-klub.html';
                    }, 2000);
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').innerHTML = '<div class="failed">❌ Error: ' + error.message + '</div>';
                document.getElementById('message').textContent = 'Hubungi admin';
            }
        }

        processPayment();
    })();
    </script>
</body>
</html>
